version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosec
    - revive
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - checkPrivateReceivers
    gosec:
      excludes:
        - G104 # Covered by errcheck
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
