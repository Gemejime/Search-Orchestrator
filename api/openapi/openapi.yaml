openapi: 3.1.0
info:
  title: RAG Search Orchestrator API
  version: 1.0.0
  description: >
    High-throughput, low-latency retrieval orchestration microservice coordinating
    normalized query caching, Triton embedding inference, parallel dense/sparse
    fan-out, Reciprocal Rank Fusion (k=60), native uint32 Roaring Bitmap ACL
    filtering, bounded Triton Cross-Encoder reranking, and Redis parent container
    hydration.

tags:
  - name: Search
    description: Staged retrieval cascade and diagnostic search endpoints.
  - name: Operations
    description: Kubernetes health probes, Prometheus metrics, and API documentation.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Bearer token validated by the Edge API Gateway (strictly redacted in logs).

  schemas:
    SearchRequest:
      type: object
      required:
        - tenant_id
        - query_text
        - caller_acl_bitmap_b64
        - embedding_model_version
      properties:
        request_id:
          type: string
          description: Optional ULID/UUID correlation identifier; generated if omitted.
          example: "01JCYZ8K9MABCDEF1234567890"
        tenant_id:
          type: string
          minLength: 1
          description: Tenant isolation identifier.
          example: "tenant-corp-01"
        query_text:
          type: string
          minLength: 1
          description: Raw user search query text.
          example: "What are the Q3 SOC 2 encryption rotation requirements?"
        caller_acl_bitmap_b64:
          type: string
          format: byte
          minLength: 1
          description: Base64-encoded compressed Roaring Bitmap of caller uint32 entitlements (never logged).
          example: "OjAAAAEAAAAAAA=="
        top_k:
          type: integer
          format: int32
          minimum: 0
          maximum: 5
          default: 5
          description: Maximum number of hydrated chunks to return (0 defaults to 5; valid range 1..5).
          example: 5
        embedding_model_version:
          type: string
          minLength: 1
          description: Dense embedding model version identifier included in Tier 1 cache keys.
          example: "bge-m3-fp16-v2"

    EnrichedChunk:
      type: object
      required:
        - doc_id
        - chunk_id
        - parent_key
        - text
        - score
      properties:
        doc_id:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          description: Immutable native uint32 document identifier.
          example: 482910
        chunk_id:
          type: string
          description: Unique chunk identifier within the document.
          example: "chk_482910_004"
        parent_key:
          type: string
          description: Redis Cluster parent container hydration key.
          example: "parent:tenant-corp-01:482910:004"
        text:
          type: string
          description: Hydrated parent container text (800-1,500 tokens).
          example: "Pre-compiled parent container text (800-1,500 tokens)..."
        score:
          type: number
          format: double
          description: Final ranking score (reranker logit or RRF score on fallback).
          example: 0.9142
        metadata:
          type: object
          additionalProperties:
            type: string
          description: Chunk metadata attributes.

    SearchResponse:
      type: object
      required:
        - request_id
        - tenant_id
        - cache_hit
        - reranker_fallback
        - chunks
        - latency_ms
      properties:
        request_id:
          type: string
          example: "01JCYZ8K9MABCDEF1234567890"
        tenant_id:
          type: string
          example: "tenant-corp-01"
        cache_hit:
          type: boolean
          example: false
        reranker_fallback:
          type: boolean
          example: false
        chunks:
          type: array
          items:
            $ref: "#/components/schemas/EnrichedChunk"
        latency_ms:
          type: number
          format: double
          example: 42.6

    ScoreTrace:
      type: object
      required:
        - dense_count
        - sparse_count
        - rrf_count
        - acl_permitted_count
        - circuit_breaker_tripped
      properties:
        dense_count:
          type: integer
          format: int32
          description: Number of dense HNSW candidates retrieved (max 40).
          example: 40
        sparse_count:
          type: integer
          format: int32
          description: Number of sparse BM25 candidates retrieved (max 40).
          example: 40
        rrf_count:
          type: integer
          format: int32
          description: Number of fused RRF candidates (max 20).
          example: 20
        acl_permitted_count:
          type: integer
          format: int32
          description: Number of candidates permitted by Roaring Bitmap ACL intersection.
          example: 14
        circuit_breaker_tripped:
          type: boolean
          description: Whether Triton Cross-Encoder circuit breaker tripped or fallback was used.
          example: false
        rerank_logits:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Raw Triton Cross-Encoder logits keyed by chunk_id.
        stage_timings_ms:
          type: object
          additionalProperties:
            type: number
            format: double
          description: Per-stage execution timings in milliseconds.

    DiagnosticSearchResponse:
      allOf:
        - $ref: "#/components/schemas/SearchResponse"
        - type: object
          required:
            - score_trace
          properties:
            score_trace:
              $ref: "#/components/schemas/ScoreTrace"

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid tenant_id, empty query_text, or malformed caller_acl_bitmap"

    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "alive"

    ReadinessResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: "ready"
        checks:
          type: object
          additionalProperties:
            type: string
          example:
            redis: "ok"
            triton: "ok"
            hnsw: "ok"
            bm25: "ok"

paths:
  /v1/search:
    post:
      operationId: executeSearch
      summary: Execute staged retrieval cascade
      description: >
        Executes normalized query caching, Triton embedding inference, parallel
        dense/sparse fan-out, RRF (k=60), Roaring Bitmap ACL filtering, bounded
        Triton Cross-Encoder reranking, and Redis parent container hydration.
      tags:
        - Search
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-ID
          in: header
          required: false
          schema:
            type: string
          description: Tenant identifier header.
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
          description: Optional ULID/UUID request correlation identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Successful retrieval response with up to Top-5 enriched parent chunks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "400":
          description: Invalid request parameters or malformed caller ACL bitmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal retrieval error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/search/diagnostic:
    post:
      operationId: executeDiagnosticSearch
      summary: Execute staged retrieval cascade with score waterfall diagnostics
      description: >
        Executes the same staged retrieval cascade as POST /v1/search while
        returning per-stage candidate counts, reranker logits, and timing breakdowns.
      tags:
        - Search
      security:
        - bearerAuth: []
      parameters:
        - name: X-Tenant-ID
          in: header
          required: false
          schema:
            type: string
          description: Tenant identifier header.
        - name: X-Request-ID
          in: header
          required: false
          schema:
            type: string
          description: Optional ULID/UUID request correlation identifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Successful diagnostic retrieval response including score_trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticSearchResponse"
        "400":
          description: Invalid request parameters or malformed caller ACL bitmap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal retrieval error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: getHealthz
      summary: Kubernetes liveness probe
      description: Returns 200 OK when the orchestrator process is alive.
      tags:
        - Operations
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /ready:
    get:
      operationId: getReady
      summary: Kubernetes readiness probe
      description: Probes Redis Cluster, Triton, HNSW/BM25 pools, and graceful drain state.
      tags:
        - Operations
      responses:
        "200":
          description: Service is ready to receive traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Service is draining or downstream dependencies are unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics scrape endpoint
      description: Exposes Prometheus metrics in text exposition format.
      tags:
        - Operations
      responses:
        "200":
          description: Prometheus exposition metrics payload.
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Retrieve OpenAPI 3.1 specification
      description: Serves the raw OpenAPI 3.1 YAML specification.
      tags:
        - Operations
      responses:
        "200":
          description: Raw OpenAPI 3.1 YAML document.
          content:
            application/yaml:
              schema:
                type: string

  /docs:
    get:
      operationId: getSwaggerDocs
      summary: Swagger UI documentation interface
      description: Serves interactive Swagger UI documentation for the Search Orchestrator API.
      tags:
        - Operations
      responses:
        "200":
          description: HTML Swagger UI page.
          content:
            text/html:
              schema:
                type: string
