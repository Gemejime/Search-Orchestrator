syntax = "proto3";

package rag.search.v1;

option go_package = "github.com/rag-platform/rag-search-orchestrator/api/proto/v1;searchv1";

// SearchRequest represents a single tenant-scoped retrieval request.
message SearchRequest {
  string request_id = 1;
  string tenant_id = 2;
  string query_text = 3;
  // Compressed Roaring Bitmap of caller entitlements. NEVER log raw bytes.
  bytes caller_acl_bitmap = 4;
  // Maximum chunks to return (0 defaults to 5; valid range 1..5).
  int32 top_k = 5;
  string embedding_model_version = 6;
}

// DiagnosticSearchRequest represents a single tenant-scoped diagnostic retrieval request.
message DiagnosticSearchRequest {
  string request_id = 1;
  string tenant_id = 2;
  string query_text = 3;
  // Compressed Roaring Bitmap of caller entitlements. NEVER log raw bytes.
  bytes caller_acl_bitmap = 4;
  // Maximum chunks to return (0 defaults to 5; valid range 1..5).
  int32 top_k = 5;
  string embedding_model_version = 6;
}

// EnrichedChunk represents a hydrated parent container chunk returned to the caller.
message EnrichedChunk {
  uint32 doc_id = 1;
  string chunk_id = 2;
  string parent_key = 3;
  string text = 4;
  double score = 5;
  map<string, string> metadata = 6;
}

// SearchResponse contains the ranked, ACL-filtered, and hydrated retrieval results.
message SearchResponse {
  string request_id = 1;
  string tenant_id = 2;
  bool cache_hit = 3;
  bool reranker_fallback = 4;
  repeated EnrichedChunk chunks = 5;
  double latency_ms = 6;
}

// CandidateLogit pairs a candidate's (doc_id, chunk_id) identity with its raw Cross-Encoder logit.
message CandidateLogit {
  uint32 doc_id = 1;
  string chunk_id = 2;
  double logit = 3;
}

// ScoreTrace provides per-stage counts, reranker logits, and timing waterfalls for diagnostics.
message ScoreTrace {
  int32 dense_count = 1;
  int32 sparse_count = 2;
  int32 rrf_count = 3;
  int32 acl_permitted_count = 4;
  bool circuit_breaker_tripped = 5;
  // Preserves (doc_id, chunk_id) identity so chunks with matching chunk_id in different documents stay distinct.
  repeated CandidateLogit rerank_logits = 6;
  map<string, double> stage_timings_ms = 7;
}

// DiagnosticSearchResponse wraps SearchResponse with per-stage diagnostic telemetry.
message DiagnosticSearchResponse {
  SearchResponse response = 1;
  ScoreTrace score_trace = 2;
}
