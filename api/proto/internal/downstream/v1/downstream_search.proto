syntax = "proto3";

package rag.downstream.v1;

option go_package = "github.com/rag-platform/rag-search-orchestrator/internal/infrastructure/pb/downstreamv1;downstreamv1";

// DenseSearchService queries HNSW vector read replicas.
service DenseSearchService {
  rpc Search(DenseSearchRequest) returns (DenseSearchResponse);
}

// SparseSearchService queries distributed BM25 text shards.
service SparseSearchService {
  rpc Search(SparseSearchRequest) returns (SparseSearchResponse);
}

message DenseSearchRequest {
  string tenant_id = 1;
  repeated float vector = 2;
  int32 top_k = 3;
}

message DenseSearchResponse {
  repeated DownstreamCandidate candidates = 1;
}

message SparseSearchRequest {
  string tenant_id = 1;
  string query_text = 2;
  int32 top_k = 3;
}

message SparseSearchResponse {
  repeated DownstreamCandidate candidates = 1;
}

message DownstreamCandidate {
  uint32 doc_id = 1;
  string chunk_id = 2;
  string parent_key = 3;
  double score = 4;
  map<string, string> metadata = 5;
}
