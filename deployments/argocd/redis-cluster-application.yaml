apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rag-search-orchestrator-redis
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.bitnami.com/bitnami
    chart: redis-cluster
    targetRevision: "11.*"
    helm:
      releaseName: rag-search-orchestrator-redis
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: rag-search
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
