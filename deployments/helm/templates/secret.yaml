{{- if not .Values.redis.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "rag-search-orchestrator.redisSecretName" . }}
  labels:
    {{- include "rag-search-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.redis.secretKey }}: {{ .Values.redis.password | quote }}
{{- end }}
