# Bitnami Redis Cluster (Redis 7.2+) Helm Values for rag-search-orchestrator
# 6-node clustered topology: 3 primary shards + 3 secondary replicas.

fullnameOverride: "rag-search-orchestrator-redis"

global:
  security:
    # Reviewed pinned bitnamilegacy/* image digests/tags for 11.* chart compatibility.
    allowInsecureImages: true

existingSecret: "rag-search-orchestrator-redis"
existingSecretPasswordKey: "REDIS_PASSWORD"

image:
  repository: bitnamilegacy/redis-cluster
  tag: "7.2.7-debian-12-r0"

cluster:
  init: true
  nodes: 6
  replicas: 1

usePassword: true

redis:
  podAntiAffinityPreset: soft
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  configmap: |-
    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    maxmemory-policy allkeys-lru
    tcp-keepalive 60

persistence:
  enabled: true
  size: 5Gi
  accessModes:
    - ReadWriteOnce

metrics:
  enabled: true
  image:
    repository: bitnamilegacy/redis-exporter
    tag: "1.67.0-debian-12-r0"
  containerPorts:
    metrics: 9121
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi
