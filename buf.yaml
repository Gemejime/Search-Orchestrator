version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_DIRECTORY_MATCH
  ignore_only:
    PACKAGE_VERSION_SUFFIX:
      - api/proto/internal/triton/v2/grpc_service.proto
    RPC_REQUEST_RESPONSE_UNIQUE:
      - api/proto/internal/triton/v2/grpc_service.proto
    RPC_REQUEST_STANDARD_NAME:
      - api/proto/internal/triton/v2/grpc_service.proto
breaking:
  use:
    - FILE
